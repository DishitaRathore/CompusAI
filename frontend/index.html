<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFlow AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #172033;
        }

        .app {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            background: #263a91;
            color: white;
            padding: 24px;
            border-radius: 18px 18px 0 0;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            opacity: 0.85;
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: white;
            padding: 18px;
        }

        input,
        textarea,
        button {
            font: inherit;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2e3;
            border-radius: 10px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .chat-box {
            background: white;
            min-height: 330px;
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 80%;
            margin: 12px 0;
            padding: 12px 15px;
            border-radius: 14px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .assistant {
            background: #f1f5f9;
            margin-right: auto;
        }

        .message small {
            display: block;
            margin-top: 8px;
            color: #64748b;
        }

        .composer {
            display: flex;
            gap: 10px;
            background: white;
            padding: 18px;
            border-radius: 0 0 18px 18px;
        }

        .composer textarea {
            flex: 1;
        }

        button {
            align-self: end;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            background: #263a91;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d2c70;
        }

        .status {
            padding: 10px 18px;
            background: #fff7ed;
            color: #9a3412;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .app {
                margin: 10px;
                padding: 0;
            }

            .settings {
                grid-template-columns: 1fr;
            }

            .composer {
                flex-direction: column;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <section class="header">
            <h1>CampusFlow AI</h1>
            <p>Secure Education ERP Assistant</p>
        </section>

        <section class="settings">
            <input
                id="studentId"
                type="number"
                value="1"
                min="1"
                placeholder="Student ID"
            >

            <button id="loadHistory" type="button">
                Load History
            </button>

            <input
                id="apiKey"
                type="password"
                placeholder="Enter API key"
            >
        </section>

        <div id="status" class="status">
            Enter your API key and ask a question.
        </div>

        <section id="chatBox" class="chat-box">
            <div class="message assistant">
                Hello! I can help with attendance, fees, support tickets,
                cybersecurity, and college policies.
            </div>
        </section>

        <form id="chatForm" class="composer">
            <textarea
                id="message"
                placeholder="Ask CampusFlow AI something..."
                required
            ></textarea>

            <button type="submit">
                Send
            </button>
        </form>
    </main>

    <script>
        const chatForm = document.getElementById("chatForm");
        const chatBox = document.getElementById("chatBox");
        const statusBox = document.getElementById("status");

        const loadHistoryButton =
    document.getElementById("loadHistory");


loadHistoryButton.addEventListener("click", async function() {
    const studentId = Number(
        document.getElementById("studentId").value
    );

    const apiKey = document.getElementById("apiKey").value.trim();

    if (!apiKey) {
        statusBox.textContent = "Please enter your API key.";
        return;
    }

    statusBox.textContent = "Loading conversation history...";

    try {
        const response = await fetch(
            `/chat-history/${studentId}`,
            {
                method: "GET",
                headers: {
                    "X-API-Key": apiKey
                }
            }
        );

        const messages = await response.json();

        if (!response.ok) {
            throw new Error(
                messages.detail || "Could not load history"
            );
        }

        chatBox.innerHTML = "";

        if (messages.length === 0) {
            addMessage(
                "No previous conversation found.",
                "assistant"
            );
        } else {
            messages.forEach(function(message) {
                addMessage(
                    message.content,
                    message.role
                );
            });
        }

        statusBox.textContent = "Conversation history loaded.";
    } catch (error) {
        statusBox.textContent = error.message;
    }
});

        function addMessage(text, role, mode = "") {
            const messageElement = document.createElement("div");

            messageElement.className = `message ${role}`;
            messageElement.textContent = text;

            if (mode) {
                const modeElement = document.createElement("small");
                modeElement.textContent = `Response mode: ${mode}`;
                messageElement.appendChild(modeElement);
            }

            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const studentId = Number(
                document.getElementById("studentId").value
            );

            const apiKey = document.getElementById("apiKey").value.trim();

            const messageInput = document.getElementById("message");
            const message = messageInput.value.trim();

            if (!apiKey) {
                statusBox.textContent = "Please enter your API key.";
                return;
            }

            if (!message) {
                return;
            }

            addMessage(message, "user");

            messageInput.value = "";
            statusBox.textContent = "CampusFlow AI is thinking...";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-Key": apiKey
                    },
                    body: JSON.stringify({
                        message: message,
                        student_id: studentId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Request failed"
                    );
                }

                addMessage(
                    data.answer,
                    "assistant",
                    data.mode
                );

                statusBox.textContent = "Ready";
            } catch (error) {
                addMessage(
                    `Error: ${error.message}`,
                    "assistant"
                );

                statusBox.textContent = "Request failed";
            }
        });
    </script>
</body>
</html>
